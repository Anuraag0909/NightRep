name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Frontend Dependencies
      run: npm install
      working-directory: ./frontend

    - name: Lint Frontend
      run: npm run lint
      working-directory: ./frontend

    - name: Build and Typecheck Root
      run: npm run build

    - name: Build Frontend
      run: npm run frontend:build

    - name: Run Tests
      run: npm run test
